<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#17181c">
  <!-- ===== NEW v17 · THEME · anti-FOUC bootstrap: the chosen theme
       ('light' or the default dark) is applied to <html data-theme>
       BEFORE the stylesheets are parsed, so a light-theme user never sees
       a dark flash on load (and vice versa). The same key is read/written
       by applyTheme() in app.js (KEYS.theme). ===== -->
  <script>
    try {
      if (JSON.parse(localStorage.getItem('tutorTheme')) === 'light')
        document.documentElement.setAttribute('data-theme', 'light');
    } catch (e) { }
  </script>
  <!-- ===== CHANGED v18 · the site is ONLINE: the description no longer
       says "all local, no account needed" — the app runs in the browser
       but the optional account (Supabase sync) is now a feature. ===== -->
  <meta name="description" content="Interactive tutor for the Python Crash Course (3rd ed.) exercises: guided step-by-step decomposition, a real Python runtime in the browser, Matplotlib/Plotly charts and Pygame games — 199 exercises, no installation, optional free account to sync your progress across devices.">
  <!-- ===== NEW v19 · SEO for the online site: canonical URL, explicit
       robots, Open Graph + Twitter cards (rich preview when the link is
       shared) and JSON-LD structured data so Google can index the app as
       an educational WebApplication. The files robots.txt, sitemap.xml and
       assets/og-image.png (1200×630) complete the setup. ===== -->
  <link rel="canonical" href="https://tonecraft17.github.io/tutor-scomposizione/">
  <meta name="robots" content="index, follow">
  <meta property="og:site_name" content="Tutor · Progressive Breakdown">
  <meta property="og:title" content="Tutor · Progressive Breakdown — Python Crash Course">
  <meta property="og:description" content="Learn Python with 199 guided exercises from Python Crash Course: step-by-step decomposition, a real Python runtime in the browser, charts and playable Pygame games. No installation.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://tonecraft17.github.io/tutor-scomposizione/">
  <meta property="og:image" content="https://tonecraft17.github.io/tutor-scomposizione/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Tutor · Progressive Breakdown — Python Crash Course">
  <meta name="twitter:description" content="199 guided exercises, a real Python runtime in the browser, charts and playable games. No installation.">
  <meta name="twitter:image" content="https://tonecraft17.github.io/tutor-scomposizione/assets/og-image.png">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Tutor · Progressive Breakdown — Python Crash Course",
    "url": "https://tonecraft17.github.io/tutor-scomposizione/",
    "description": "Interactive tutor for the Python Crash Course (3rd ed.) exercises: guided step-by-step decomposition, a real Python runtime in the browser, Matplotlib/Plotly charts and Pygame games — 199 exercises, no installation.",
    "applicationCategory": "EducationalApplication",
    "operatingSystem": "Any (web browser)",
    "inLanguage": "en",
    "isAccessibleForFree": true,
    "browserRequirements": "Requires JavaScript",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "featureList": [
      "199 exercises from Python Crash Course (3rd edition)",
      "Guided step-by-step problem decomposition",
      "Real Python runtime in the browser (Pyodide)",
      "Matplotlib and Plotly charts",
      "Playable Pygame games",
      "Three-level hint system",
      "Optional free account to sync progress"
    ],
    "keywords": "learn python, python exercises, python crash course, python tutor, python in the browser, pyodide, matplotlib, pygame"
  }
  </script>
  <!-- ===== NEW v14 · inline SVG favicon: kills the 404 on /favicon.ico that
       Lighthouse reported as a console error (Best Practices) and avoids the
       extra request — the mark is the same as the titlebar brand ===== -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='5' fill='%2317181c'/><g fill='none' stroke='%234f9cf7' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'><path d='M12 3v3'/><path d='M4 8a8 8 0 0 1 16 0'/><path d='M3.5 8.5c2.5 1 4.5 1 6 0 1 2 3 2 5 0 1.5 1 3.5 1 6 0'/><path d='M12 12v6a2.2 2.2 0 0 0 4.4 0'/></g></svg>">
  <title>Tutor · Progressive Breakdown — Python Crash Course</title>
  <!-- ?v=19 · cache-busting: bump the version on every release, so the
       browser never serves a stale app.js/styles.css from the HTTP cache
       (for nested modules use serve.py, which disables caching entirely) -->
  <link rel="stylesheet" href="styles.css?v=19">
  <!-- ===== CHANGED v17 · styles-light.css is now PART of the project: it
       is the LIGHT theme of the Settings → Appearance switch (the old
       test-only file swap is gone). Every rule in it is scoped under
       [data-theme="light"], so loading it always costs nothing in dark
       mode and the switch is instantaneous (no reload, no FOUC). In the
       light theme the terminals and every code-writing area STAY BLACK
       (a terminal is dark in any theme) — see the file header. ===== -->
  <link rel="stylesheet" href="styles-light.css?v=19">
  <!-- ===== CHANGED v14 · PERFORMANCE: plotly.js (1.33 MB, 77% unused on load)
       is NO LONGER preloaded with <script defer> — it was on the critical
       path of every first visit (LCP 17.6 s). The Charts panel loads it on
       demand through ensurePlotlyJs() in app.js, which already existed as
       the fallback path: the first chart pays a one-time ~1 MB download,
       every page load before it gets faster. ===== -->
  <!-- dns-prefetch (not preconnect: both CDNs are used only later, at the
       first Python run / first chart — a preconnect would stay unused for
       the whole page load) for the two runtime CDNs -->
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <link rel="dns-prefetch" href="https://cdn.plot.ly">
  <!-- ===== modulepreload (NEW v15 · PERFORMANCE): the ES-module chain was a
       "waterfall" — the browser had to download and parse app.js before
       discovering its imports, then parse those before discovering
       solutions-index.js: three sequential network rounds before the first
       render (83% of the LCP was render delay). modulepreload hands the
       whole static module graph to the browser up front: every module is
       fetched in parallel, in one round, while app.js is still downloading.
       ===== CHANGED v16.1 · the hrefs now carry the SAME ?v=19 as the
       import specifiers inside the modules: a stale service worker can no
       longer serve a mix of old engine/*.js and a fresh app.js (that mix
       was the "modules tab does not open" bug). Keep them
       character-for-character identical to the import specifiers, or each
       file would be fetched twice. The deploy procedure does not change:
       bump ?v= everywhere on each release. ===== -->
  <link rel="modulepreload" href="data/exercises.js?v=19">
  <link rel="modulepreload" href="config.js?v=19">
  <link rel="modulepreload" href="engine/dock.js?v=19">
  <link rel="modulepreload" href="engine/tutor.js?v=19">
  <link rel="modulepreload" href="engine/solutions-db.js?v=19">
  <link rel="modulepreload" href="engine/storage.js?v=19">
  <link rel="modulepreload" href="engine/python-runner.js?v=19">
  <link rel="modulepreload" href="engine/ponte.js?v=19">
  <link rel="modulepreload" href="data/solutions-index.js?v=19">
  <script>
    if (location.protocol === 'file:') {
      document.addEventListener('DOMContentLoaded', function () {
        document.body.setAttribute('style', 'margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#17181c;color:#d8dae0;font:.875rem/1.75 system-ui,Segoe UI,sans-serif;text-align:center;padding:26px');
        document.body.innerHTML =
          '<div style="max-width:560px">' +
          '<h2 style="margin:0 0 12px">A small local server is required</h2>' +
          '<p style="color:#9a9eab">This version uses <b>ES6 modules</b>, which browsers block when the page is opened directly from <code>file://</code>.</p>' +
          '<pre style="background:#141519;border:1px solid #33353d;border-radius:9px;padding:13px;text-align:left;display:inline-block;margin:10px 0">cd tutor-scomposizione-esm\npython -m http.server 8000\n\n# then open http://localhost:8000</pre>' +
          '</div>';
      });
    }
  </script>
</head>

<body>
  <header class="titlebar" id="titlebar">
    <div class="tl-dots"><i class="r"></i><i class="y"></i><i class="g"></i></div>
    <div class="brand" id="brandBox">
      <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="#4f9cf7" stroke-width="1.7" stroke-linecap="round"
        stroke-linejoin="round">
        <path d="M12 3v3" />
        <path d="M4 8a8 8 0 0 1 16 0" />
        <path d="M3.5 8.5c2.5 1 4.5 1 6 0 1 2 3 2 5 0 1.5 1 3.5 1 6 0" />
        <path d="M12 12v6a2.2 2.2 0 0 0 4.4 0" />
      </svg>
      <span>Tutor · Progressive Breakdown</span>
      <!-- ===== CHANGED v18 · header slimmed down: the sub-brand kept only
           "Python Crash Course" (the "Exercises Ch. 1–20 + Appendices"
           enumeration moved to the Modules drawer, which already lists the
           chapters). ===== -->
      <span class="sub" id="brandSub">Python Crash Course</span>
    </div>
    <div class="tl-center">
      <search class="searchbox" id="searchBox">
        <svg class="ic" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-3.5-3.5" />
        </svg>
        <input id="globalSearch" type="search" aria-label="Search exercise"
          placeholder="Search exercise… (e.g. «3-4» or «guests»)" autocomplete="off">
      </search>
    </div>
    <div class="tl-right">
      <button class="tl-btn" id="btnGuida" title="How the method works and how to move the panels">? Guide</button>
      <!-- ===== REMOVED v19 · the "⟲ Reset" button: reset moved into
           Settings → Reset (one place for every "start over"). ===== -->
      <!-- ===== NEW v17 · the ACCOUNT button lives in the top-right corner:
           a click opens a popover with the account info and the synthetic
           progress; its "⚙ edit" entry opens the Settings overlay
           (credentials, privacy, theme). Replaces the old activity-bar
           icon. Populated by renderAccountChrome() in app.js. ===== -->
      <button class="tl-btn tl-acct" id="btnAccount" aria-haspopup="menu" aria-expanded="false" title="Account and progress"></button>
    </div>
  </header>

  <div class="workbench">
    <nav class="activitybar" id="activitybar" aria-label="Activity bar"></nav>
    <main class="dock-root" id="dockRoot" aria-label="Work area"></main>
  </div>

  <div id="mobileView">
    <div class="m-head" id="mHead"></div>
    <!-- ===== CHANGED v14 · a11y: this was a <div> — with .workbench (and its
         <main id="dockRoot">) hidden on mobile, the mobile view exposed NO
         main landmark (Lighthouse/axe: "Document does not have a main
         landmark"). It is a <main> now: exactly one main landmark is visible
         in either mode. ===== -->
    <main class="m-content" id="mContent"></main>
    <nav class="m-nav" id="mNav" aria-label="Mobile navigation"></nav>
  </div>

  <footer class="statusbar" id="statusbar"></footer>
  <div id="toasts" role="status" aria-live="polite"></div>
  <!-- ===== NEW v19 · cookie notice for the online site: shown once on
       the first visit (app.js arms it), honest and minimal — this app sets
       NO cookies and runs NO analytics; progress and preferences live in
       the browser's localStorage. "privacy" opens the Settings overlay. -->
  <div id="cookieBar" hidden role="region" aria-label="Cookie notice">
    <span class="cb-txt">🍪 No tracking cookies: your progress and preferences stay in <b>your browser</b>.</span>
    <span class="cb-acts">
      <button class="btn tiny" id="cbInfo">privacy</button>
      <button class="btn primary tiny" id="cbOk">got it</button>
    </span>
  </div>
  <div id="modalHost"></div>
  <!-- ===== NEW v16 · hosts for the Modules side drawer and the Guide
       overlay: they stay EMPTY (and their children [hidden]) until the
       user opens them, so they cost nothing on the first paint — the
       progressive rendering and the LCP path are untouched. ===== -->
  <div id="drawerHost"></div>
  <div id="overlayHost"></div>
  <!-- ===== NEW v17 · same trick for the Settings overlay (theme,
       credentials, privacy). ===== -->
  <div id="settingsHost"></div>

  <script type="module" src="app.js?v=19"></script>
  <!-- ===== NEW v15 · PERFORMANCE: service worker for repeat visits.
       GitHub Pages pins Cache-Control: max-age=600 on every asset (~184 kB
       re-downloaded on each visit within 10 minutes). The worker caches
       same-origin assets (cache-first) and the HTML (network-first, so a
       deploy is NEVER masked by a stale shell). Registered after load, so
       it costs nothing on the critical path. https:// only: local dev via
       serve.py keeps its no-store behaviour; add ?sw to the localhost URL
       to test the worker locally. sw.js itself is always rechecked thanks
       to updateViaCache:'none'. ===== -->
  <script>
    if ('serviceWorker' in navigator && (location.protocol === 'https:' ||
        (location.hostname === 'localhost' && new URLSearchParams(location.search).has('sw')))) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(function () { });
      });
    }
  </script>
</body>

</html>
